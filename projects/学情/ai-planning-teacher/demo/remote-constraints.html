<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>告诉老师您的想法 · AI 规划老师</title>
<style>
:root{
  --c-warm:#FF8A3D; --c-warm-dark:#E8701E; --c-warm-soft:#FFF1E6;
  --g-warm:linear-gradient(135deg,#FFA36B 0%,#FF8A3D 60%,#F2661A 100%);
  --c-brand:#2E7BFF; --c-brand-dark:#1F5FE0; --c-brand-soft:#E8F1FF;
  --c-ink:#1F2229; --c-ink2:#4A5160; --c-ink3:#7A818F; --c-ink4:#B8BDC6;
  --c-bg:#FFF8F1; --c-card:#FFFFFF; --c-sub:#FBF4EB; --c-line:#EDE4D6;
  --sh-card:0 1px 2px rgba(40,25,10,.04),0 8px 20px rgba(40,25,10,.06);
  --ff:'PingFang SC','Hiragino Sans GB',-apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;font-family:var(--ff);color:var(--c-ink);}
body{min-height:100vh;background:#1A1410;display:flex;justify-content:center;align-items:flex-start;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;border:none;background:none;cursor:pointer;padding:0;color:inherit;}
input,textarea{font-family:inherit;}
.app{width:100%;max-width:420px;min-height:100vh;background:var(--c-bg);position:relative;overflow-x:hidden;padding-bottom:100px;}
@media(min-width:421px){body{padding:24px 0;}.app{min-height:calc(100vh - 48px);border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;}}

.sbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:15px;font-weight:600;color:var(--c-ink);}
.sbar .r{display:flex;gap:6px;align-items:center;}
.sbar .bat{width:24px;height:12px;border:1.5px solid currentColor;border-radius:3px;position:relative;opacity:.85;}
.sbar .bat::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0;}
.sbar .bat i{position:absolute;left:1px;top:1px;bottom:1px;width:72%;background:currentColor;border-radius:1px;display:block;}

.nav{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff;border-bottom:1px solid var(--c-line);}
.nav-back{width:40px;height:40px;border-radius:14px;background:var(--c-sub);display:flex;align-items:center;justify-content:center;}
.nav-back:active{background:var(--c-line);}
.nav-title{flex:1;text-align:center;font-size:16px;font-weight:600;}

.head{padding:20px 20px 16px;background:#fff;border-bottom:1px solid var(--c-line);}
.head h1{font-size:20px;font-weight:700;margin:0 0 6px;line-height:28px;}
.head p{font-size:13px;line-height:20px;color:var(--c-ink2);margin:0;}

.form{padding:16px 16px 8px;}
.card{background:var(--c-card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--sh-card);}
.card h2{font-size:15px;font-weight:600;margin:0 0 12px;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:10px 16px;border-radius:20px;background:var(--c-sub);color:var(--c-ink2);font-size:13px;font-weight:500;border:1.5px solid transparent;transition:all .15s;}
.chip:active{transform:scale(.96);}
.chip.on{background:var(--c-warm-soft);color:var(--c-warm-dark);border-color:var(--c-warm);}
.field{margin-top:12px;}
.field-input{width:100%;height:44px;padding:0 14px;background:var(--c-sub);border:1.5px solid var(--c-line);border-radius:12px;font-size:14px;outline:none;color:var(--c-ink);}
.field-input:focus{border-color:var(--c-warm);background:#fff;}
.field-textarea{width:100%;min-height:88px;padding:12px 14px;background:var(--c-sub);border:1.5px solid var(--c-line);border-radius:12px;font-size:14px;line-height:22px;outline:none;color:var(--c-ink);resize:vertical;}
.field-textarea:focus{border-color:var(--c-warm);background:#fff;}
.field-hint{font-size:12px;color:var(--c-ink3);margin-top:6px;}

.cta{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:420px;background:#fff;border-top:1px solid var(--c-line);padding:12px 16px max(12px,env(safe-area-inset-bottom));z-index:50;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;font-weight:600;transition:transform .1s,opacity .15s;font-size:16px;height:52px;width:100%;}
.btn:active{transform:scale(.98);opacity:.9;}
.btn-primary{background:var(--c-warm);color:#fff;box-shadow:0 6px 16px rgba(255,138,61,.28);}

.waiting{display:none;padding:32px 24px;text-align:center;}
.waiting.active{display:block;}
.waiting-ic{width:80px;height:80px;margin:0 auto 20px;border-radius:24px;background:var(--c-brand-soft);display:flex;align-items:center;justify-content:center;color:var(--c-brand);position:relative;}
.waiting-ic::before,.waiting-ic::after{content:'';position:absolute;inset:-8px;border-radius:28px;border:2px solid var(--c-brand);opacity:.3;animation:pulse 2s ease-out infinite;}
.waiting-ic::after{animation-delay:1s;}
@keyframes pulse{0%{transform:scale(1);opacity:.5;}100%{transform:scale(1.3);opacity:0;}}
.waiting h2{font-size:20px;font-weight:700;margin:0 0 10px;}
.waiting p{font-size:14px;line-height:22px;color:var(--c-ink2);margin:0 0 24px;}
.waiting .demo{font-size:12px;padding:10px 18px;border-radius:20px;background:var(--c-sub);color:var(--c-ink3);display:inline-block;margin-top:12px;}

@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fade{animation:fadein .3s ease;}
</style>
</head>
<body>
<div class="app">
  <div class="sbar">
    <span>9:41</span>
    <div class="r">
      <div class="bat"><i></i></div>
    </div>
  </div>

  <div class="nav">
    <a class="nav-back" href="invite-response.html" aria-label="返回">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
    </a>
    <div class="nav-title">告诉老师您的想法</div>
    <div style="width:40px;"></div>
  </div>

  <div class="head">
    <h1>跟老师说一下您的想法</h1>
    <p>帮孩子把节奏把好，让计划更合适</p>
  </div>

  <div id="formView" class="form fade">
    <div class="card">
      <h2>最晚学到几点</h2>
      <div class="chip-row">
        <button class="chip" onclick="toggleChip(this,'time')">21:00</button>
        <button class="chip" onclick="toggleChip(this,'time')">21:30</button>
        <button class="chip" onclick="toggleChip(this,'time')">22:00</button>
      </div>
      <div class="field">
        <input class="field-input" type="time" placeholder="或者自己填一个时间"/>
      </div>
    </div>

    <div class="card">
      <h2>中途怎么休息</h2>
      <div class="chip-row">
        <button class="chip" onclick="toggleChip(this,'rest')">每 30 分钟休一下</button>
        <button class="chip" onclick="toggleChip(this,'rest')">每 45 分钟休一下</button>
        <button class="chip" onclick="toggleChip(this,'rest')">每 60 分钟休一下</button>
        <button class="chip" onclick="toggleChip(this,'rest')">让孩子自己掌握</button>
      </div>
    </div>

    <div class="card">
      <h2>这段时间有补习班吗</h2>
      <div class="chip-row">
        <button class="chip" onclick="toggleChip(this,'class')">周一到周五有</button>
        <button class="chip" onclick="toggleChip(this,'class')">周末有</button>
        <button class="chip" onclick="toggleChip(this,'class')">都没有</button>
      </div>
    </div>

    <div class="card">
      <h2>您觉得哪里最要紧</h2>
      <div class="chip-row">
        <button class="chip" onclick="toggleChipMulti(this)">数学基础</button>
        <button class="chip" onclick="toggleChipMulti(this)">作文</button>
        <button class="chip" onclick="toggleChipMulti(this)">英语听力</button>
        <button class="chip" onclick="toggleChipMulti(this)">理科应用题</button>
        <button class="chip" onclick="toggleChipMulti(this)">阅读理解</button>
        <button class="chip" onclick="toggleChipMulti(this)">保持现有节奏</button>
      </div>
    </div>

    <div class="card">
      <h2>补充想说的（可选）</h2>
      <textarea class="field-textarea" placeholder="比如：最近孩子有点累，强度别太高"></textarea>
      <div class="field-hint">这些想法会传给孩子，AI 会参考您的建议来排计划</div>
    </div>
  </div>

  <div id="waitingView" class="waiting">
    <div class="waiting-ic">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <h2>已收到您的建议</h2>
    <p>正在等待孩子上传试卷，AI 会结合您的想法来分析。请留意后续通知。</p>
    <a class="demo" href="plan-draft-review.html">演示用：模拟规划已生成</a>
  </div>

  <div id="ctaBar" class="cta">
    <button class="btn btn-primary" onclick="submit()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>把这些告诉孩子，让他开始上传试卷</span>
    </button>
  </div>
</div>

<script>
function toggleChip(el,group){
  var siblings=el.parentElement.querySelectorAll('.chip');
  siblings.forEach(function(s){s.classList.remove('on');});
  el.classList.add('on');
}
function toggleChipMulti(el){
  el.classList.toggle('on');
}
function submit(){
  document.getElementById('formView').style.display='none';
  document.getElementById('ctaBar').style.display='none';
  document.getElementById('waitingView').classList.add('active');
  window.scrollTo(0,0);
}
</script>
</body>
</html>
