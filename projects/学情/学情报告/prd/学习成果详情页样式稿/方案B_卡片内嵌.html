<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>方案B：卡片内嵌 - 阅读详情页</title>
  <style>
    :root {
      --n900: #1f2229; --n700: #656a73; --n500: #999da6; --n200: #e4e5e7;
      --n100: #f3f4f6; --n50: #f8f8fa; --white: #ffffff; --blue: #38afff;
      --blue-data: #1098f3; --green: #52c41a; --orange: #ff6509; --red: #ff4d4f;
      --blue-soft: #e8f5ff; --green-soft: #f6ffed; --orange-soft: #fff7e8;
      --header-grad: linear-gradient(180deg, #5fcfff 0%, #9be7ff 34%, #e3f3ff 78%, #f3f4f6 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { min-height: 100vh; background: #e8eaed; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--n900); -webkit-font-smoothing: antialiased; }
    button { border: 0; background: none; font-family: inherit; cursor: pointer; }
    .phone { width: 100%; max-width: 375px; min-height: 100vh; margin: 0 auto; background: var(--n100); overflow-x: hidden; }
    .page-head { background: var(--header-grad); padding: 10px 16px 18px; }
    .nav { height: 44px; display: flex; align-items: center; justify-content: space-between; }
    .nav-btn { width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--n900); background: rgba(255, 255, 255, 0.38); backdrop-filter: blur(6px); font-size: 20px; }
    .nav-title { font-size: 17px; font-weight: 500; }
    .overview-card { background: var(--white); border-radius: 16px; padding: 20px 16px 16px; margin: 12px 16px 0; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08); }
    .card-kicker { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--blue-soft); color: var(--blue-data); font-size: 11px; margin-bottom: 10px; font-weight: 500; }
    .card-title { font-size: 24px; line-height: 32px; font-weight: 700; margin-bottom: 8px; }
    .card-desc { font-size: 14px; line-height: 22px; color: var(--n700); margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--n100); }
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .metric-card { background: var(--n50); border-radius: 10px; padding: 12px 10px; }
    .metric-label { font-size: 11px; color: var(--n700); line-height: 16px; margin-bottom: 4px; }
    .metric-value { display: flex; align-items: baseline; gap: 2px; color: var(--blue-data); }
    .metric-num { font-size: 24px; line-height: 28px; font-weight: 600; letter-spacing: -0.5px; }
    .metric-unit { font-size: 11px; color: var(--n700); }
    .metric-change { font-size: 11px; line-height: 16px; margin-top: 4px; color: var(--n700); }
    .metric-change.positive { color: var(--green); }
    .metric-change.negative { color: var(--red); }
    .metric-value.level .metric-num { font-size: 18px; color: var(--n900); }
    .insight { border-radius: 10px; background: linear-gradient(135deg, #f0faff 0%, #ffffff 100%); border-left: 3px solid var(--blue); padding: 12px; font-size: 13px; line-height: 21px; color: var(--n700); }
    .insight strong { color: var(--n900); font-weight: 600; }
    .tag-inline { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 11px; color: var(--blue-data); background: var(--blue-soft); margin: 0 2px; }
    .content { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 34px; margin-top: -4px; }
    .card { background: var(--white); border-radius: 12px; padding: 16px; }
    .footer-safe { height: 34px; background: var(--n100); }
    .home-bar { width: 134px; height: 5px; background: var(--n900); border-radius: 3px; margin: 8px auto 0; }
  </style>
</head>
<body>
  <main class="phone">
    <header class="page-head">
      <nav class="nav">
        <button class="nav-btn">‹</button>
        <div class="nav-title">学习成果详情</div>
        <button class="nav-btn">···</button>
      </nav>
      <article class="overview-card">
        <div class="card-kicker">周报 04.28-05.04</div>
        <h1 class="card-title">英语分级阅读完成情况</h1>
        <p class="card-desc">本周共完成绘本 <strong>5 本</strong>，较上周增加 2 本，阅读积极性明显提升。</p>
        <div class="metric-grid">
          <div class="metric-card">
            <div class="metric-label">本周阅读时长</div>
            <div class="metric-value"><span class="metric-num">2</span><span class="metric-unit">小时 18分</span></div>
            <div class="metric-change positive">较上周 +34分钟</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">累计词汇量</div>
            <div class="metric-value"><span class="metric-num">1,248</span></div>
            <div class="metric-change positive">本周新增 +86个</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">当前阅读等级</div>
            <div class="metric-value level"><span class="metric-num">Level 3</span></div>
            <div class="metric-change">适合小学中年级</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">单词测试正确率</div>
            <div class="metric-value"><span class="metric-num">78</span><span class="metric-unit">%</span></div>
            <div class="metric-change negative">较上周 -4%，需关注</div>
          </div>
        </div>
        <div class="insight">小丸子本周阅读量持续提升，<strong>词汇积累稳步增长</strong>。单词测验正确率有所下降，建议配合 <span class="tag-inline">天天记单词</span> 复习工具巩固新词，推荐使用。</div>
      </article>
    </header>
    <section class="content">
      <article class="card">
        <div style="font-size: 16px; font-weight: 600; margin-bottom: 12px;">本周已读绘本</div>
        <div style="color: var(--n700); font-size: 13px; line-height: 20px;">共完成 5 本绘本，累计阅读时长 2小时18分钟</div>
      </article>
    </section>
    <div class="footer-safe"><div class="home-bar"></div></div>
  </main>
</body>
</html>
