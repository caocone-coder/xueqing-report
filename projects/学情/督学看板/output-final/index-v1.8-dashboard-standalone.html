.card-title{font-size:15px;font-weight:600;color:#1a1a2e}
.card-subtitle{font-size:12px;color:#999}

.calendar{padding:0 16px 0}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:6px}
.cal-header span{font-size:11px;color:#bbb;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 0;justify-items:center}

.cal-legend{display:flex;gap:20px;justify-content:flex-start;padding:8px 8px 6px;align-items:center}
.cal-legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#656a73}
.cal-legend-color{width:16px;height:10px;border-radius:4px}
.cal-legend-color.red{background:#fde8e8}
.cal-legend-color.green{background:#e8f8ef}
.card-footer{border-top:1px solid #f0f0f0;padding:11px 16px;display:flex;justify-content:space-between;font-size:12px;color:#666}
.card-footer .green{color:#27ae60;font-weight:600}

.app-item{display:flex;align-items:center;padding:8px 16px;cursor:pointer}

.app-info{flex:1;min-width:0}
.app-name{font-size:13px;color:#1f2229;line-height:20px}
.app-bar-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.app-bar{height:4px;border-radius:10px;background:#3478f6}
.app-duration{font-size:12px;color:#656a73;white-space:nowrap;line-height:16px}
.app-arrow{color:#ccc;font-size:14px;margin-left:8px;flex-shrink:0}
.expand-btn{text-align:left;padding:6px 16px;font-size:12px;color:#999;cursor:pointer;display:flex;align-items:center;justify-content:flex-start;gap:4px}
.expand-btn .arrow{transition:transform .3s;display:inline-block;font-size:10px}
.expand-btn .arrow.up{transform:rotate(180deg)}
.app-footer{border-top:1px solid #f0f0f0;padding:11px 16px;display:flex;justify-content:space-between;align-items:flex-start}

.app-footer .compare{font-size:13px;color:#e67e22}

.script-btns{display:flex;gap:8px;padding:0 16px 16px;justify-content:flex-end}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn .3s ease}

function renderCalendar(c){
const days=['一','二','三','四','五','六','日'];
let grid='';const offset=(c.firstDayOfWeek-1+7)%7;
for(let i=0;i<offset;i++)grid+='<div class="cal-day empty"></div>';
const today=16;
for(let d=1;d<=c.totalDays;d++){
let cls='future';
if(c.used.includes(d))cls='used';
else if(c.unused.includes(d))cls='unused';
grid+=`<div class="cal-day ${cls}">${d}</div>`}
return `<div class="card"><div class="card-header"><span class="card-title">使用日历</span><span class="card-subtitle">${c.month}</span></div>
<div class="calendar"><div class="cal-header">${days.map(d=>'<span>'+d+'</span>').join('')}</div>

}
function renderAppItem(a,isSelf){
const url=isSelf?'page-footprint-self':'page-footprint-third';
return `<div class="app-item" onclick="parent.navigateTo('${url}')"><img class="app-icon" src="${a.icon}" alt="${a.name}"><div class="app-info"><div class="app-name">${a.name}</div><div class="app-bar-row"><div class="app-bar" style="width:${a.bar}px"></div><span class="app-duration">${a.dur}</span></div></div><span class="app-arrow">&#x203A;</span></div>`
}
function renderApps(a){
const visibleSelf=expanded?a.self:a.self.slice(0,3);
const hiddenCount=a.self.length-3;
let expandHtml='';
if(a.self.length>3)expandHtml=`<div class="expand-btn" id="expandBtn">${expanded?'收起':'展开其余 '+hiddenCount+' 个应用'} <span class="arrow ${expanded?'up':''}">&#x25BC;</span></div>`;
return `<div class="card"><div class="card-header"><span class="card-title">今日使用应用</span><span class="card-subtitle" style="font-size:13px">${a.date}</span></div>
<div class="section-title">自研应用</div>${visibleSelf.map(x=>renderAppItem(x,true)).join('')}${expandHtml}
<div class="section-title">三方应用</div>${a.third.map(x=>renderAppItem(x,false)).join('')}
<div class="app-footer"><div class="total">总时长&nbsp;&nbsp;<b>${a.totalH}</b>&nbsp;小时&nbsp;<b>${a.totalM}</b>&nbsp;分钟</div><div class="compare">${a.compare}</div></div></div>`
}
function renderPlans(plans,s){
return `<div class="card"><div class="card-header"><span class="card-title">已报名的学习计划</span></div>
<div style="padding:0 16px 8px">
${plans.map(p=>`<div class="plan-item" onclick="parent.navigateTo('page-report-detail')" style="padding:0;margin-bottom:16px;cursor:pointer"><div class="plan-info" style="width:100%"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><div style="display:flex;align-items:center;gap:4px"><span class="plan-name">${p.name}</span><svg width="5" height="9" viewBox="0 0 5 9" fill="none"><path d="M1 1l3 3.5L1 8" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="plan-tag">${p.tag}</span></div><div class="plan-bar-bg" style="width:100%;margin-bottom:6px"><div class="plan-bar-fill" style="width:${p.pct}%"></div></div><div class="plan-pct" style="margin-top:0">${p.done}/${p.total} ${p.pct}%</div></div></div>`).join('')}
</div>
<div class="plan-footer" style="display:flex;justify-content:space-between;align-items:center"><div class="rate">综合完成率 <b>${s.pct}%</b> (${s.done}/${s.total})</div><div class="warn" style="margin-top:0">当前${s.behind}个计划进度落后</div></div></div>`
}
function renderScript(){
var d=DATA[curChild];var s=d.scripts;var phase=s.phase;var day=s.day;
var isNewbie=(phase!=='常态期');
var dims=isNewbie?["阶段引导","异常提醒","朋友圈文案"]:["节点话术","异常提醒","朋友圈文案"];
if(dims.indexOf(curDim)<0)curDim=dims[0];
var alertScenes=["异常时间","异常内容"];if(s["异常提醒"]["使用沉默"])alertScenes.push("使用沉默");
var momentScenes=["学习成果"];
var scenes,text,phaseLabel='';
if(curDim==='阶段引导'){
var sc=s["阶段引导"].scenes;scenes=Object.keys(sc);
if(!curScene||scenes.indexOf(curScene)<0)curScene=scenes[0];
text=sc[curScene];phaseLabel=s["阶段引导"].label;
}else if(curDim==='节点话术'){
var nd=s["节点话术"].nodes;scenes=Object.keys(nd);
if(!curScene||scenes.indexOf(curScene)<0)curScene=scenes[0];
text=nd[curScene];
var an=s["节点话术"].activeNode;
phaseLabel=an.icon+' '+an.name+' · 还有'+an.daysUntil+'天';
}else if(curDim==='异常提醒'){
scenes=alertScenes;if(!curScene||scenes.indexOf(curScene)<0)curScene=scenes[0];
text=s["异常提醒"][curScene]||'当前无此类异常';
}else{
scenes=momentScenes;if(!curScene||scenes.indexOf(curScene)<0)curScene=scenes[0];
text=s["朋友圈文案"][curScene];
}
var alertCount=0;for(var k=0;k<alertScenes.length;k++){if(s["异常提醒"][alertScenes[k]])alertCount++;}
var phaseLabelHtml=phaseLabel?'<div style="padding:6px 16px 0;font-size:12px;color:#3478f6;font-weight:600;">'+phaseLabel+'</div>':'';
var sceneHtml=curDim==='朋友圈文案'?'':'<div class="scene-filters">'+scenes.map(function(sc){return '<button class="scene-pill'+(sc===curScene?' active':'')+'" data-scene="'+sc+'">'+sc+'</button>';}).join('')+'</div>';
return '<div class="card"><div class="card-header"><span class="card-title">督学话术</span><span class="card-subtitle blue" id="sendRecord">发送记录 \u203A</span></div>'+
'<div class="dim-tabs">'+dims.map(function(dm){return '<button class="dim-tab'+(dm===curDim?' active':'')+'" data-dim="'+dm+'">'+dm+(dm==='异常提醒'&&alertCount?'<span class="badge">'+alertCount+'</span>':'')+'</button>';}).join('')+'</div>'+
phaseLabelHtml+sceneHtml+
'<div class="script-box fade-in" id="scriptBox">'+(text||'')+'</div>'+
'<div class="script-btns"><button class="btn-refresh" id="btnRefresh">换一换</button><button class="btn-send" id="btnSend">发送家长</button></div></div>';
}
function bindEvents(){
const eb=$('#expandBtn');if(eb)eb.onclick=()=>{expanded=!expanded;renderContent()};
$$('.dim-tab').forEach(b=>b.onclick=()=>{curDim=b.dataset.dim;renderContent()});
$$('.scene-pill').forEach(b=>b.onclick=()=>{curScene=b.dataset.scene;renderContent()});
const rb=$('#btnRefresh');if(rb)rb.onclick=()=>{const box=$('#scriptBox');box.style.opacity='0';setTimeout(()=>{box.style.opacity='1'},200)};
const sb=$('#btnSend');if(sb)sb.onclick=()=>{const text=$('#scriptBox').textContent;navigator.clipboard&&navigator.clipboard.writeText(text).catch(()=>{});try{parent.sopFollowedToday=true}catch(e){};showToast('已复制到剪贴板')};
}
renderTabs();renderContent();
</script>
</body>
</html>
