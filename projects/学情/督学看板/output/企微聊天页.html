<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>企微聊天</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #ededed;
    height: 100vh;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .phone {
    width: 100%;
    max-width: 400px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #ededed;
  }

  /* ── Top bar ── */
  .top-bar {
    background: #ededed;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 0.5px solid #d9d9d9;
    flex-shrink: 0;
  }
  .top-bar .back { width: 22px; height: 22px; color: #191919; flex-shrink: 0; }
  .top-bar .center { flex: 1; text-align: center; }
  .top-bar .center .name { font-size: 17px; font-weight: 500; color: #191919; }
  .top-bar .center .sub { font-size: 11px; color: #999; margin-top: 1px; }
  .top-bar .actions { display: flex; gap: 16px; align-items: center; }
  .top-bar .actions svg { width: 22px; height: 22px; color: #191919; }

  /* ── Chat area ── */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .chat-spacer { flex: 1; }

  .time-label {
    text-align: center;
    font-size: 12px;
    color: #b0b0b0;
    padding: 4px 0;
  }

  /* ── Message row (right-aligned) ── */
  .msg-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    flex-direction: row-reverse;
  }

  .avatar {
    width: 42px; height: 42px;
    border-radius: 6px;
    flex-shrink: 0;
    overflow: hidden;
    background: #e0e0e0;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .bubble {
    max-width: 260px;
    background: #fff;
    border-radius: 10px 0 10px 10px;
    padding: 12px 14px;
    font-size: 15px;
    line-height: 1.7;
    color: #191919;
  }

  /* ── Card message ── */
  .card-msg {
    max-width: 260px;
    background: #fff;
    border-radius: 10px 0 10px 10px;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
    display: block;
    color: inherit;
  }
  .card-msg:active { background: #f5f5f5; }

  .card-msg-source {
    padding: 10px 12px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-msg-source-icon {
    width: 20px; height: 20px;
    border-radius: 4px;
    flex-shrink: 0;
    object-fit: cover;
  }
  .card-msg-source-name {
    font-size: 12px;
    color: #999;
  }

  .card-msg-content {
    padding: 8px 12px;
    font-size: 15px;
    line-height: 1.6;
    color: #191919;
  }

  .card-msg-cover {
    margin: 0 12px 10px;
    height: 120px;
    border-radius: 6px;
    background: linear-gradient(135deg, #dcfce7 0%, #d1fae5 50%, #a7f3d0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-msg-cover svg { width: 40px; height: 40px; color: #22c55e; opacity: 0.5; }

  .card-msg-footer {
    padding: 8px 12px;
    border-top: 0.5px solid #ebebeb;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .card-msg-footer svg { width: 12px; height: 12px; color: #c0c0c0; }
  .card-msg-footer span { font-size: 11px; color: #c0c0c0; }

  /* ── Toolbar ── */
  .toolbar {
    flex-shrink: 0;
    padding: 8px 12px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    border-top: 0.5px solid #d9d9d9;
    background: #f6f6f6;
    -webkit-overflow-scrolling: touch;
  }
  .toolbar::-webkit-scrollbar { display: none; }
  .toolbar-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-radius: 6px;
    background: #fff;
    border: none;
    font-size: 13px;
    color: #333;
    white-space: nowrap;
  }
  .toolbar-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .toolbar-btn .icon-green { color: #22c55e; }
  .toolbar-btn .icon-orange { color: #f97316; }
  .toolbar-btn .icon-blue { color: #3b82f6; }

  /* ── Bottom input ── */
  .bottom-bar {
    background: #f6f6f6;
    padding: 8px 12px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .bottom-bar svg { width: 28px; height: 28px; color: #191919; flex-shrink: 0; }
  .bottom-bar .input-box {
    flex: 1;
    height: 36px;
    background: #fff;
    border: none;
    border-radius: 6px;
    padding: 0 12px;
    font-size: 15px;
    outline: none;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
