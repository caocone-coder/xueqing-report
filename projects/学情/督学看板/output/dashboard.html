.child-tabs{display:flex;overflow:hidden}
.child-tab{font-size:14px;color:#999;padding:10px 16px 12px;cursor:pointer;position:relative;border:none;background:none;font-family:inherit;border-bottom:2px solid transparent;flex-shrink:0}
.child-tab.active{color:#3478f6;font-weight:600;border-bottom-color:#3478f6}

.content{padding:12px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:12px;overflow:hidden}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 14px}
.card-title{font-size:15px;font-weight:600;color:#1a1a2e}
.card-subtitle{font-size:12px;color:#999}
.card-subtitle.blue{font-size:13px;color:#3478f6;cursor:pointer}
/* Calendar */
.calendar{padding:0 16px 0}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:6px}
.cal-header span{font-size:11px;color:#bbb;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 0;justify-items:center}
.cal-day{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.cal-day.used{background:#e8f8ef;color:#27ae60}
.cal-day.unused{background:#fde8e8;color:#e74c3c}
.cal-day.future{background:#f5f6fa;color:#ccc;font-weight:400}
.cal-day.empty{background:transparent}
.cal-legend{display:flex;gap:20px;justify-content:flex-start;padding:8px 8px 6px;align-items:center}
.cal-legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#656a73}
.cal-legend-color{width:16px;height:10px;border-radius:4px}
.cal-legend-color.red{background:#fde8e8}
.cal-legend-color.green{background:#e8f8ef}
.card-footer{border-top:1px solid #f0f0f0;padding:11px 16px;display:flex;justify-content:space-between;font-size:12px;color:#666}
.card-footer .green{color:#27ae60;font-weight:600}

.app-duration{font-size:12px;color:#656a73;white-space:nowrap;line-height:16px}
.app-arrow{color:#ccc;font-size:14px;margin-left:8px;flex-shrink:0}
.expand-btn{text-align:left;padding:6px 16px;font-size:12px;color:#999;cursor:pointer;display:flex;align-items:center;justify-content:flex-start;gap:4px}
.expand-btn .arrow{transition:transform .3s;display:inline-block;font-size:10px}

.app-footer{border-top:1px solid #f0f0f0;padding:11px 16px;display:flex;justify-content:space-between;align-items:flex-start}

.scene-pill.active{background:#3478f6;color:#fff}
.script-box{margin:10px 16px;background:#f8f9fc;border:1px solid #eee;border-radius:10px;padding:11px 14px;font-size:14px;color:#333;line-height:23.8px;min-height:164px;white-space:pre-line}
.script-btns{display:flex;gap:8px;padding:0 16px 16px;justify-content:flex-end}
.mini-app-card{margin:0 16px 12px;background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.mini-app-icon{flex-shrink:0}
.mini-app-info{flex:1;min-width:0}

.btn-refresh{width:68px;height:28.5px;border-radius:6px;background:#f5f6fa;color:#666;border:none;font-size:12px;cursor:pointer;font-family:inherit}
.btn-send{width:80px;height:28.5px;border-radius:6px;background:#3478f6;color:#fff;border:none;font-size:12px;cursor:pointer;font-family:inherit}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn .3s ease}
</style>

function renderCalendar(c){

${plans.map(p=>`<div class="plan-item" onclick="location.href='report-detail.html'" style="padding:0;margin-bottom:16px;cursor:pointer"><div class="plan-info" style="width:100%"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><div style="display:flex;align-items:center;gap:4px"><span class="plan-name">${p.name}</span><svg width="5" height="9" viewBox="0 0 5 9" fill="none"><path d="M1 1l3 3.5L1 8" stroke="#999" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="plan-tag">${p.tag}</span></div><div class="plan-bar-bg" style="width:100%;margin-bottom:6px"><div class="plan-bar-fill" style="width:${p.pct}%"></div></div><div class="plan-pct" style="margin-top:0">${p.done}/${p.total} ${p.pct}%</div></div></div>`).join('')}
</div>
<div class="plan-footer" style="display:flex;justify-content:space-between;align-items:center"><div class="rate">综合完成率 <b>${s.pct}%</b> (${s.done}/${s.total})</div><div class="warn" style="margin-top:0">当前${s.behind}个计划进度落后</div></div></div>`
}
function renderScript(){
const dims=["基础使用","学科使用","异常提醒"];
const scenes=["提醒督促","表扬鼓励","关怀回访"];
const alertScenes=["异常时间","异常内容"];
const d=DATA[curChild];
if(curDim==='异常提醒'&&!alertScenes.includes(curScene))curScene=alertScenes[0];
if(curDim==='基础使用'&&!scenes.includes(curScene))curScene=scenes[0];
const text=curDim==='学科使用'?d.scripts[curDim]['表扬鼓励']:d.scripts[curDim][curScene];
const curScenes=curDim==='异常提醒'?alertScenes:scenes;
const sceneHtml=curDim==='学科使用'?'':'<div class="scene-filters">'+curScenes.map(sc=>`<button class="scene-pill${sc===curScene?' active':''}" data-scene="${sc}">${sc}</button>`).join('')+'</div>';
const miniAppCard=curDim==='学科使用'?'<div class="mini-app-card" onclick="location.href=\'/Users/a1-6/CC_project/projects/student-performance-report/index.html\'"><div class="mini-app-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="#f5f6fa"/><path d="M7 8h10M7 12h6M7 16h8" stroke="#3478f6" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="mini-app-info"><div class="mini-app-title">小明已完成 4 月 18 日～4 月 25 日的学习</div><div class="mini-app-desc">快来看看吧</div></div><svg width="7" height="12" viewBox="0 0 7 12" fill="none" style="flex-shrink:0;margin-left:auto;"><path d="M1 1l5 5-5 5" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>':'';
return `<div class="card"><div class="card-header"><span class="card-title">督学话术</span><span class="card-subtitle blue" id="sendRecord">发送记录 &#x203A;</span></div>
<div class="dim-tabs">${dims.map(dm=>`<button class="dim-tab${dm===curDim?' active':''}" data-dim="${dm}">${dm}${dm==='异常提醒'?'<span class="badge">2</span>':''}</button>`).join('')}</div>
${sceneHtml}
<div class="script-box fade-in" id="scriptBox">${text}</div>
${miniAppCard}
<div class="script-btns"><button class="btn-refresh" id="btnRefresh">换一换</button><button class="btn-send" id="btnSend">发送家长</button></div></div>`
}
function bindEvents(){
const eb=$('#expandBtn');if(eb)eb.onclick=()=>{expanded=!expanded;renderContent()};
$$('.dim-tab').forEach(b=>b.onclick=()=>{curDim=b.dataset.dim;renderContent()});
$$('.scene-pill').forEach(b=>b.onclick=()=>{curScene=b.dataset.scene;renderContent()});
const rb=$('#btnRefresh');if(rb)rb.onclick=()=>{const box=$('#scriptBox');box.style.opacity='0';setTimeout(()=>{box.style.opacity='1'},200)};
const sb=$('#btnSend');if(sb)sb.onclick=()=>{const text=$('#scriptBox').textContent;navigator.clipboard&&navigator.clipboard.writeText(text).catch(()=>{});showToast('已复制到剪贴板')};
}
renderTabs();renderContent();
</script>
