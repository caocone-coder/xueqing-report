<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>督学报告 - 张小明</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; background: #f5f6fa; color: #1a1a2e; font-size: 14px; max-width: 414px; margin: 0 auto; min-height: 100vh; padding-bottom: 20px; }
.header { background: #fff; padding: 16px 16px 0; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.header-title { font-size: 17px; font-weight: 600; }
.header-sub { font-size: 12px; color: #999; }
.week-selector { font-size: 13px; color: #666; background: #f5f6fa; padding: 6px 12px; border-radius: 6px; border: none; }
.child-tabs { display: flex; gap: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.child-tabs::-webkit-scrollbar { display: none; }
.child-tab { flex-shrink: 0; padding: 10px 16px; font-size: 14px; color: #999; cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; white-space: nowrap; }
.child-tab .days-tag { font-size: 10px; color: #999; font-weight: 400; margin-left: 4px; background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
.module { background: #fff; border-radius: 12px; margin: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.module-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
.module-title .sub { font-size: 12px; color: #999; font-weight: 400; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; text-align: center; }
.cal-grid .cal-head { font-size: 11px; color: #bbb; padding: 4px 0; }
.cal-grid .cal-cell { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; margin: 2px auto; cursor: pointer; }
.cal-cell.used { background: #e8f8ef; color: #27ae60; font-weight: 600; }
.cal-cell.unused { background: #fde8e8; color: #e74c3c; font-weight: 600; }
.cal-cell.future { background: #f5f6fa; color: #ccc; }
.cal-cell.empty { background: transparent; }
.cal-stat { display: flex; gap: 16px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #f0f0f0; font-size: 12px; color: #666; }
.cal-stat .highlight { color: #e74c3c; font-weight: 600; }
/* PLACEHOLDER_MORE_STYLES */
.app-group-title { font-size: 13px; font-weight: 600; margin: 10px 0 8px; display: flex; justify-content: space-between; }
.app-group-title .pct { font-weight: 400; color: #999; }
.app-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.app-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 600; flex-shrink: 0; }
.app-info { flex: 1; }
.app-name { font-size: 13px; }
.app-bar-wrap { height: 6px; background: #f0f0f0; border-radius: 3px; margin-top: 4px; }
.app-bar { height: 100%; border-radius: 3px; }
.app-bar.learn { background: #5c6bc0; }
.app-bar.other { background: #e67e22; }
.app-duration { font-size: 12px; color: #999; flex-shrink: 0; }
.total-row { display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid #f0f0f0; margin-top: 10px; font-size: 13px; }
.total-row .change.down { color: #e67e22; }
.total-row .change.up { color: #27ae60; }
.warn-bar { background: #fef3e2; color: #e67e22; font-size: 12px; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
.plan-card { margin-bottom: 12px; }
.plan-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.plan-name { font-size: 13px; font-weight: 500; }
.plan-status { font-size: 11px; padding: 2px 8px; border-radius: 4px; }
.plan-status.done { background: #e8f8ef; color: #27ae60; }
.plan-status.ongoing { background: #e8eaf6; color: #5c6bc0; }
.plan-status.behind { background: #fef3e2; color: #e67e22; }
.progress-bar { height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 4px; transition: width .3s; }
.progress-fill.green { background: #27ae60; }
.progress-fill.blue { background: #5c6bc0; }
.progress-fill.orange { background: #e67e22; }
.plan-pct { font-size: 12px; color: #999; margin-top: 4px; }
.plan-overall { padding-top: 10px; border-top: 1px solid #f0f0f0; font-size: 13px; color: #666; }
.plan-overall span { font-weight: 600; color: #1a1a2e; }
.scene-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.scene-tab { flex: 1; text-align: center; padding: 10px 0; border-radius: 8px; border: 1px solid #e0e0e0; font-size: 13px; cursor: pointer; background: #fff; transition: all .2s; }
.scene-tab.active { border-color: #5c6bc0; background: #e8eaf6; color: #5c6bc0; font-weight: 600; }
.dim-tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid #eee; }
.dim-tab { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; cursor: pointer; color: #999; border-bottom: 2px solid transparent; transition: all .2s; }
.dim-tab.active { color: #5c6bc0; font-weight: 600; border-bottom-color: #5c6bc0; }
.dim-tab .badge { display: inline-block; min-width: 16px; height: 16px; line-height: 16px; font-size: 10px; background: #e74c3c; color: #fff; border-radius: 8px; margin-left: 4px; padding: 0 4px; }
.script-box { background: #f8f9fc; border-radius: 12px; padding: 16px; margin-bottom: 12px; line-height: 1.7; font-size: 14px; color: #333; border: 1px solid #eee; }
.script-actions { display: flex; gap: 10px; margin-bottom: 16px; }
.script-actions button { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; cursor: pointer; border: none; }
.btn-refresh { background: #f5f6fa; color: #666; }
.btn-copy { background: #5c6bc0; color: #fff; font-weight: 600; }
.data-summary { background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.data-summary-title { font-size: 13px; color: #999; margin-bottom: 8px; }
.data-summary-item { font-size: 13px; color: #666; padding: 3px 0; }
.data-summary-item::before { content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: #bbb; margin-right: 8px; vertical-align: middle; }
.empty-state { text-align: center; padding: 40px 20px; color: #bbb; font-size: 14px; }
.alert-card { background: #fff7f0; border: 1px solid #fde0c8; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; font-size: 13px; color: #c0392b; line-height: 1.6; }
.alert-card .alert-type { font-size: 11px; font-weight: 600; color: #e74c3c; background: #fde8e8; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; display: inline-block; }
.script-card { background: #fff; border-radius: 12px; margin: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.script-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.script-card-title { font-size: 15px; font-weight: 600; }
.script-dim-tabs { display: flex; gap: 0; margin-bottom: 14px; border-bottom: 1px solid #eee; }
.script-dim-tab { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; cursor: pointer; color: #999; border-bottom: 2px solid transparent; transition: all .2s; position: relative; }
.script-dim-tab.active { color: #5c6bc0; font-weight: 600; border-bottom-color: #5c6bc0; }
.script-dim-tab .badge { position: absolute; top: 4px; right: calc(50% - 30px); min-width: 16px; height: 16px; line-height: 16px; font-size: 10px; background: #e74c3c; color: #fff; border-radius: 8px; padding: 0 4px; }
.script-body { min-height: 120px; }
.script-content { background: #f8f9fc; border-radius: 10px; padding: 14px; line-height: 1.7; font-size: 14px; color: #333; border: 1px solid #eee; margin-bottom: 12px; }
.script-filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.script-filter { font-size: 12px; color: #888; cursor: pointer; padding: 4px 12px; background: #f5f6fa; border: none; border-radius: 20px; transition: all .2s; line-height: 1.4; }
.script-filter.active { color: #fff; background: #5c6bc0; }
.script-bottom { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
.script-bottom button { padding: 6px 16px; border-radius: 6px; font-size: 12px; cursor: pointer; border: none; }
.btn-refresh-sm { background: #f5f6fa; color: #666; }
.btn-copy-sm { background: #5c6bc0; color: #fff; font-weight: 500; }
.empty-state { text-align: center; padding: 30px 20px; color: #bbb; font-size: 13px; }
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.7); color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 14px; z-index: 999; display: none; }
.popup-mask { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 199; display: none; }
.popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #fff; border-radius: 12px; padding: 20px; width: 280px; box-shadow: 0 4px 20px rgba(0,0,0,.15); z-index: 200; display: none; }
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div><div class="header-title" id="parentName">张小明妈妈</div><div class="header-sub">督学报告</div></div>
    <select class="week-selector"><option>本周 (4/14-4/20)</option><option>上周 (4/7-4/13)</option></select>
  </div>
  <div class="child-tabs" id="childTabs"></div>
</div>
<div id="content"></div>
<div class="toast" id="toast"></div>
<div class="popup-mask" id="dayMask" onclick="closeDayPopup()"></div>
<div class="popup" id="dayPopup"></div>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<!-- PLACEHOLDER_SCRIPT -->
<script>
const CHILDREN = [
  {
    name:"张小明", grade:"五年级", activeDays: 32, usedDays: new Set([1,2,3,5,7,8,10]),
    apps:{ learn:[{n:"瑞恩熊AI英语",t:"0h52m",p:38,c:"#5c6bc0"},{n:"数学同步练习",t:"0h25m",p:18,c:"#3f51b5"},{n:"分级阅读",t:"0h20m",p:15,c:"#7986cb"}], other:[{n:"乐读",t:"0h40m",p:29,c:"#e67e22"}] },
    totalTime:"2h17m", change:"-65%", changeDir:"down", learnPct:58,
    plans:[{n:"语文每日一练",done:2,total:7,status:"behind"},{n:"英语单词打卡",done:1,total:7,status:"behind"},{n:"数学思维训练",done:0,total:7,status:"behind"}],
    planDone:"3/21", planPct:"14%",
    scripts:{
      basic:{ praise:"张小明妈妈您好! 小明之前学习机使用得挺规律的, 英语和数学都有在坚持, 这个习惯非常好。希望能继续保持下去, 有什么需要帮助的随时联系我。", remind:"张小明妈妈您好! 小明的学习机已经连续3天没有使用了, 之前一直保持得挺好的, 每天都有在用。本周学习计划也只完成了14%, 建议这两天提醒孩子打开学习机, 保持住使用习惯。有什么问题随时联系我!", care:"张小明妈妈您好! 最近想了解一下小明学习机的使用情况, 看到这周使用时间比上周少了不少, 是不是最近比较忙? 有什么使用上的问题可以随时找我, 我来帮您解决。" },
      usage:"张小明妈妈您好! 小明这周学习了 2 小时 17 分钟, 虽然比上周少了一些, 但英语学科的精力投入尤为突出, 瑞恩熊AI英语用了 52 分钟, 坚持得很好! 数学同步练习也有在用, 掌握进度值得肯定。本周学习计划进度稍微落后, 提醒孩子坚持完成就更好了!",
      alert:[{type:"深夜使用",detail:"发现小明昨晚 23:30 还在使用学习机, 建议您关注一下作息时间, 保证充足睡眠对学习效果更好哦!"},{type:"应用使用时长",detail:"本周'乐读'使用时长达 5 小时 12 分钟, 占比较高, 建议适当控制, 引导孩子多使用学习类应用。"}]
    },
    defaultDim:"basic", defaultScene:"remind"
  },
  {
    name:"张小美", grade:"二年级", activeDays: 68, usedDays: new Set([1,2,3,4,5,7,8,9,10,11,12,14]),
    apps:{ learn:[{n:"分级阅读",t:"1h30m",p:35,c:"#5c6bc0"},{n:"英语天天练",t:"1h10m",p:27,c:"#3f51b5"},{n:"数学口算",t:"0h45m",p:18,c:"#7986cb"}], other:[{n:"乐读",t:"0h50m",p:20,c:"#e67e22"}] },
    totalTime:"4h15m", change:"+22%", changeDir:"up", learnPct:80,
    plans:[{n:"英语单词打卡",done:7,total:7,status:"done"},{n:"数学口算练习",done:5,total:7,status:"ongoing"}],
    planDone:"12/14", planPct:"86%",
    scripts:{
      basic:{ praise:"张小明妈妈您好! 小美这周表现非常棒, 几乎每天都在使用学习机, 英语打卡全部完成, 学习习惯保持得很好! 继续加油!", remind:"张小明妈妈您好! 小美这周整体使用不错, 数学口算练习还差2天, 提醒孩子坚持完成就圆满了!", care:"张小明妈妈您好! 小美学习机用得挺好的, 想了解一下使用过程中有没有什么建议或需要帮助的? 随时找我!" },
      usage:"张小明妈妈您好! 小美这周学习了 4 小时 15 分钟, 比上周多了 22%, 进步明显! 分级阅读坚持得最好, 用了 1 小时 30 分钟, 英语天天练也很积极。学习应用占比达到 80%, 使用习惯非常健康, 值得表扬!",
      alert:[]
    },
    defaultDim:"basic", defaultScene:"praise"
  }
];

let currentChildIdx = 0;
let currentView = 'detail';
let currentDim = 'basic';
let currentScene = 'remind';

function switchChild(idx) {
  currentChildIdx = idx;
  renderChildTabs();
  renderDetail();
}

function switchBasicScene(key) {
  const u = CHILDREN[currentChildIdx];
  document.querySelectorAll('.script-filters .script-filter').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('scriptText').textContent = u.scripts.basic[key];
}

function switchAlert(idx) {
  const u = CHILDREN[currentChildIdx];
  document.querySelectorAll('.script-filters .script-filter').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('scriptText').textContent = u.scripts.alert[idx].detail;
}

function refreshScript() {
  const box = document.getElementById('scriptText');
  box.style.opacity = '0.5';
  setTimeout(() => { box.style.opacity = '1'; showToast('已重新生成'); }, 400);
}

function copyScript() {
  const text = document.getElementById('scriptText').textContent;
  navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板'));
}

function renderChildTabs() {
  document.getElementById('childTabs').innerHTML = CHILDREN.map((c, i) =>
    `<div class="child-tab ${i === currentChildIdx ? 'active' : ''}" onclick="switchChild(${i})">${c.name} ${c.grade}<span class="days-tag">购机${c.activeDays}天</span></div>`
  ).join('');
}

function renderDetail() {
  const u = CHILDREN[currentChildIdx];
  const year = 2026, month = 3;
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = 15;
  const heads = ['日','一','二','三','四','五','六'].map(d => `<div class="cal-head">${d}</div>`).join('');
  let cells = '';
  for (let i = 0; i < firstDay; i++) cells += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    let cls = 'future';
    if (d <= today) cls = u.usedDays.has(d) ? 'used' : 'unused';
    cells += `<div class="cal-cell ${cls}" onclick="showDayPopup(${d},'${cls}')">${d}</div>`;
  }
  const usedCount = u.usedDays.size;
  const streak = 3;
  let calHtml = `<div class="module"><div class="module-title">设备使用日历 <span class="sub">4月</span></div>
    <div class="cal-grid">${heads}${cells}</div>
    <div class="cal-stat"><span>本月已使用 ${usedCount}天 / 已过${today}天</span><span class="${streak >= 3 ? 'highlight' : ''}">连续未使用 ${streak}天</span></div></div>`;

  const learnApps = u.apps.learn.map(a => `<div class="app-item"><div class="app-icon" style="background:${a.c}">${a.n.charAt(0)}</div>
    <div class="app-info"><div class="app-name">${a.n}</div><div class="app-bar-wrap"><div class="app-bar learn" style="width:${a.p}%"></div></div></div>
    <div class="app-duration">${a.t}</div></div>`).join('');
  const otherApps = u.apps.other.map(a => `<div class="app-item"><div class="app-icon" style="background:${a.c}">${a.n.charAt(0)}</div>
    <div class="app-info"><div class="app-name">${a.n}</div><div class="app-bar-wrap"><div class="app-bar other" style="width:${a.p}%"></div></div></div>
    <div class="app-duration">${a.t}</div></div>`).join('');
  const warnHtml = u.learnPct < 40 ? '<div class="warn-bar">学习应用占比偏低, 仅 ' + u.learnPct + '%</div>' : '';
  let appHtml = `<div class="module"><div class="module-title">本周应用使用 <span class="sub">时长排序</span></div>
    ${warnHtml}
    <div class="app-group-title">学习应用 <span class="pct">${u.learnPct}%</span></div>${learnApps}
    <div class="app-group-title">其他应用 <span class="pct">${100 - u.learnPct}%</span></div>${otherApps}
    <div class="total-row"><span>总时长 ${u.totalTime}</span><span class="change ${u.changeDir}">较上周 ${u.change}</span></div></div>`;

  const plansHtml = u.plans.map(p => {
    const pct = Math.round(p.done / p.total * 100);
    const sLabel = p.status === 'done' ? '完成' : p.status === 'ongoing' ? '进行中' : '落后';
    const sClass = p.status === 'done' ? 'done' : p.status === 'ongoing' ? 'ongoing' : 'behind';
    const barClass = p.status === 'done' ? 'green' : p.status === 'ongoing' ? 'blue' : 'orange';
    return `<div class="plan-card"><div class="plan-card-header"><span class="plan-name">${p.n}</span><span class="plan-status ${sClass}">${sLabel}</span></div>
      <div class="progress-bar"><div class="progress-fill ${barClass}" style="width:${pct}%"></div></div>
      <div class="plan-pct">${p.done}/${p.total} ${pct}%</div></div>`;
  }).join('');
  let planHtml = `<div class="module"><div class="module-title">学习计划 <span class="sub">本周</span></div>
    ${plansHtml}<div class="plan-overall">综合完成率 <span>${u.planPct}</span> (${u.planDone})</div></div>`;

  // Script section - tabbed
  const alertBadge = u.scripts.alert.length > 0 ? `<span class="badge">${u.scripts.alert.length}</span>` : '';
  let scriptHtml = `<div class="script-card">
    <div class="script-card-header"><div class="script-card-title">督学话术</div></div>
    <div class="script-dim-tabs">
      <div class="script-dim-tab active" onclick="switchDim('basic')">基础使用</div>
      <div class="script-dim-tab" onclick="switchDim('usage')">使用情况</div>
      <div class="script-dim-tab" onclick="switchDim('alert')">异常提醒${alertBadge}</div>
    </div>
    <div class="script-body" id="scriptBody"></div>
  </div>`;

  document.getElementById('content').innerHTML = calHtml + appHtml + planHtml + scriptHtml;
  currentDim = 'basic';
  renderScriptBody();
}

function renderScriptBody() {
  const u = CHILDREN[currentChildIdx];
  let html = '';
  if (currentDim === 'basic') {
    const scenes = [{k:'praise',l:'表扬鼓励'},{k:'remind',l:'提醒督促'},{k:'care',l:'关怀回访'}];
    const filters = scenes.map(s => `<span class="script-filter ${s.k === u.defaultScene ? 'active' : ''}" onclick="switchBasicScene('${s.k}')">${s.l}</span>`).join('');
    html = `<div class="script-filters">${filters}</div>
      <div class="script-content" id="scriptText">${u.scripts.basic[u.defaultScene]}</div>
      <div class="script-bottom"><button class="btn-refresh-sm" onclick="refreshScript()">换一换</button><button class="btn-copy-sm" onclick="copyScript()">复制话术</button></div>`;
  } else if (currentDim === 'usage') {
    html = `<div class="script-content" id="scriptText">${u.scripts.usage}</div>
      <div class="script-bottom"><button class="btn-refresh-sm" onclick="refreshScript()">换一换</button><button class="btn-copy-sm" onclick="copyScript()">复制话术</button></div>`;
  } else {
    if (u.scripts.alert.length === 0) {
      html = '<div class="empty-state">暂无异常, 孩子使用情况正常</div>';
    } else {
      const filters = u.scripts.alert.map((a,i) => `<span class="script-filter ${i===0?'active':''}" onclick="switchAlert(${i})">${a.type}</span>`).join('');
      html = `<div class="script-filters">${filters}</div>
        <div class="script-content" id="scriptText">${u.scripts.alert[0].detail}</div>
        <div class="script-bottom"><button class="btn-refresh-sm" onclick="refreshScript()">换一换</button><button class="btn-copy-sm" onclick="copyScript()">复制话术</button></div>`;
    }
  }
  document.getElementById('scriptBody').innerHTML = html;
}

function switchDim(key) {
  currentDim = key;
  document.querySelectorAll('.script-dim-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderScriptBody();
}

function showDayPopup(day, cls) {
  if (cls === 'future') return;
  const used = cls === 'used';
  const html = used
    ? `<div style="font-weight:600;margin-bottom:10px;">4月${day}日 使用详情</div><div style="font-size:13px;color:#666;line-height:1.8;">总使用时长: 1h25m<br>瑞恩熊AI英语: 42m<br>数学同步练习: 28m<br>分级阅读: 15m</div><button onclick="closeDayPopup()" style="margin-top:14px;width:100%;padding:10px;border:none;border-radius:8px;background:#f5f6fa;font-size:14px;cursor:pointer;">关闭</button>`
    : `<div style="font-weight:600;margin-bottom:10px;">4月${day}日</div><div style="font-size:13px;color:#999;">当日未使用学习机</div><button onclick="closeDayPopup()" style="margin-top:14px;width:100%;padding:10px;border:none;border-radius:8px;background:#f5f6fa;font-size:14px;cursor:pointer;">关闭</button>`;
  document.getElementById('dayPopup').innerHTML = html;
  document.getElementById('dayPopup').style.display = 'block';
  document.getElementById('dayMask').style.display = 'block';
}

function closeDayPopup() {
  document.getElementById('dayPopup').style.display = 'none';
  document.getElementById('dayMask').style.display = 'none';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 1500);
}

renderChildTabs();
renderDetail();
</script>
</body>
</html>
