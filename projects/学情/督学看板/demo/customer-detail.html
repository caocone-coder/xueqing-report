<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>客户详情</title>
<style>
  :root {
    --bg-top: #f6efe7;
    --bg-bottom: #eef3ff;
    --phone-bg: #f6f8fe;
    --card-bg: rgba(255, 255, 255, 0.96);
    --line: #e8ebf5;
    --text-strong: #1f2758;
    --text-main: #485071;
    --text-soft: #858da8;
    --accent: #4f68d8;
    --accent-deep: #384ea7;
    --accent-soft: #edf1ff;
    --success: #2fb36e;
    --success-soft: #e8f8ef;
    --warning: #f29c38;
    --warning-soft: #fff3e5;
    --danger: #e55f68;
    --danger-soft: #ffedf0;
    --shadow-lg: 0 28px 80px rgba(44, 62, 136, 0.18);
    --shadow-md: 0 16px 34px rgba(45, 62, 128, 0.11);
    --shadow-sm: 0 8px 20px rgba(65, 86, 172, 0.08);
    --safe-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(255, 255, 255, 0.92) 0, rgba(255, 255, 255, 0) 34%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--text-main);
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 999px;
    filter: blur(10px);
    opacity: 0.72;
    pointer-events: none;
  }

  body::before {
    width: 260px;
    height: 260px;
    background: rgba(255, 227, 192, 0.48);
    top: -120px;
    right: -60px;
  }

  body::after {
    width: 320px;
    height: 320px;
    background: rgba(178, 201, 255, 0.36);
    left: -140px;
    bottom: -120px;
  }

  .preview-shell {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .phone-shell {
    width: min(100%, 414px);
    min-height: calc(100vh - 48px);
    background:
      radial-gradient(circle at top right, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0) 28%),
      linear-gradient(180deg, #f8faff 0%, var(--phone-bg) 100%);
    border-radius: 34px;
    box-shadow: var(--shadow-lg);
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.55);
  }

  .phone-shell::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 85% 8%, rgba(93, 124, 255, 0.14), rgba(93, 124, 255, 0) 22%),
      radial-gradient(circle at 6% 24%, rgba(253, 189, 112, 0.14), rgba(253, 189, 112, 0) 20%);
    pointer-events: none;
  }

  .page {
    position: relative;
    min-height: calc(100vh - 48px);
    padding: 14px 16px calc(28px + var(--safe-bottom));
  }

  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .nav-btn,
  .text-link,
  .entry-link,
  .child-brief,
  .entry-card,
  .search-box,
  .service-chip {
    appearance: none;
    border: none;
    background: transparent;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }

  .nav-btn {
    width: 40px;
    height: 40px;
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.86);
    box-shadow: var(--shadow-sm);
    color: var(--text-strong);
  }

  .nav-title {
    flex: 1;
    min-width: 0;
    text-align: center;
  }

  .nav-title-main {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-strong);
  }

  .nav-title-sub {
    margin-top: 3px;
    font-size: 12px;
    color: var(--text-soft);
  }

  .ghost-slot {
    width: 40px;
  }

  .hero-card {
    position: relative;
    overflow: hidden;
    padding: 18px;
    border-radius: 26px;
    background:
      linear-gradient(145deg, rgba(82, 108, 220, 0.98), rgba(61, 81, 175, 0.94)),
      linear-gradient(180deg, #5f7df4 0%, #4157b7 100%);
    color: #fff;
    box-shadow: 0 20px 34px rgba(53, 72, 158, 0.26);
  }

  .hero-card::before,
  .hero-card::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    pointer-events: none;
  }

  .hero-card::before {
    width: 180px;
    height: 180px;
    top: -92px;
    right: -46px;
  }

  .hero-card::after {
    width: 120px;
    height: 120px;
    bottom: -48px;
    left: -24px;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .hero-label {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .hero-title {
    margin-top: 8px;
    font-size: 27px;
    line-height: 1.16;
    font-weight: 700;
  }

  .hero-note {
    margin-top: 6px;
    font-size: 13px;
    line-height: 1.58;
    color: rgba(255, 255, 255, 0.84);
  }

  .hero-aside {
    min-width: 86px;
    padding: 8px 10px;
    border-radius: 15px;
    text-align: center;
    background: rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(10px);
    font-size: 12px;
    color: rgba(255, 255, 255, 0.9);
    line-height: 1.45;
  }

  .hero-panels {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 14px;
  }

  .hero-panel {
    padding: 12px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(6px);
  }

  .hero-panel-value {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.1;
  }

  .hero-panel-label {
    margin-top: 4px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.82);
  }

  .card {
    margin-top: 14px;
    padding: 16px;
    border-radius: 22px;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    border: 1px solid rgba(255, 255, 255, 0.72);
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 14px;
  }

  .section-title {
    font-size: 17px;
    line-height: 1.2;
    font-weight: 700;
    color: var(--text-strong);
  }

  .section-note {
    margin-top: 4px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-soft);
  }

  .text-link {
    flex-shrink: 0;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    padding-top: 2px;
  }

  .customer-main {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .customer-avatar {
    width: 54px;
    height: 54px;
    border-radius: 18px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #e8ecf9 0%, #d5dced 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-deep);
    font-size: 18px;
    font-weight: 700;
  }

  .customer-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .customer-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-strong);
  }

  .customer-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px;
    border-radius: 999px;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 11px;
    font-weight: 700;
  }

  .customer-badge::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  .customer-sub {
    margin-top: 4px;
    font-size: 13px;
    color: var(--text-soft);
  }

  .detail-grid {
    display: grid;
    gap: 10px;
    margin-top: 14px;
  }

  .detail-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .detail-label {
    min-width: 64px;
    font-size: 12px;
    color: var(--text-soft);
  }

  .detail-value {
    font-size: 13px;
    line-height: 1.65;
    color: var(--text-main);
  }

  .tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tag {
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }

  .tag.gray {
    background: #f3f5fb;
    color: var(--text-main);
  }

  .tag.blue {
    background: var(--accent-soft);
    color: var(--accent-deep);
  }

  .tag.green {
    background: var(--success-soft);
    color: var(--success);
  }

  .behavior-list {
    display: grid;
    gap: 10px;
  }

  .behavior-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px;
    border-radius: 18px;
    background: #fafbff;
  }

  .behavior-dot {
    width: 8px;
    height: 8px;
    margin-top: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--accent);
    box-shadow: 0 0 0 5px rgba(79, 104, 216, 0.08);
  }

  .behavior-text {
    font-size: 13px;
    line-height: 1.65;
    color: var(--text-main);
  }

  .study-entry {
    padding: 0;
    overflow: hidden;
  }

  .entry-card {
    width: 100%;
    display: block;
    text-align: left;
    padding: 18px;
    border-radius: 22px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(248, 250, 255, 0.98) 100%);
  }

  .entry-card:hover,
  .child-brief:hover,
  .search-box:hover,
  .service-chip:hover {
    transform: translateY(-1px);
  }

  .entry-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .entry-kicker {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
  }

  .entry-title {
    margin-top: 6px;
    font-size: 22px;
    line-height: 1.2;
    font-weight: 700;
    color: var(--text-strong);
  }

  .entry-link {
    flex-shrink: 0;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    padding-top: 2px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }

  .status-pill::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
  }

  .status-pill.danger {
    color: var(--danger);
    background: var(--danger-soft);
  }

  .status-pill.warning {
    color: var(--warning);
    background: var(--warning-soft);
  }

  .status-pill.good {
    color: var(--success);
    background: var(--success-soft);
  }

  .entry-summary {
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.72;
    color: var(--text-main);
  }

  .focus-box {
    margin-top: 14px;
    padding: 14px;
    border-radius: 20px;
    background: #f7f9ff;
    box-shadow: inset 0 0 0 1px rgba(79, 104, 216, 0.06);
  }

  .focus-label {
    font-size: 12px;
    color: var(--text-soft);
  }

  .focus-main {
    margin-top: 8px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
  }

  .focus-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-strong);
  }

  .focus-meta {
    margin-top: 3px;
    font-size: 12px;
    color: var(--text-soft);
  }

  .focus-tag {
    flex-shrink: 0;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-deep);
    background: var(--accent-soft);
  }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-top: 14px;
  }

  .metric-card {
    padding: 12px 10px;
    border-radius: 18px;
    background: #fff;
    box-shadow: var(--shadow-sm);
  }

  .metric-value {
    font-size: 16px;
    line-height: 1.3;
    font-weight: 700;
    color: var(--text-strong);
  }

  .metric-label {
    margin-top: 5px;
    font-size: 12px;
    line-height: 1.45;
    color: var(--text-soft);
  }

  .action-callout {
    margin-top: 14px;
    padding: 13px 14px;
    border-radius: 18px;
    font-size: 13px;
    line-height: 1.65;
    background: #f4f6fb;
  }

  .action-callout.danger {
    color: #af4351;
    background: linear-gradient(180deg, #fff5f6 0%, #fff0f3 100%);
  }

  .action-callout.warning {
    color: #af6b1b;
    background: linear-gradient(180deg, #fff8ec 0%, #fff2e2 100%);
  }

  .action-callout.good {
    color: #268556;
    background: linear-gradient(180deg, #effaf4 0%, #e8f7ef 100%);
  }

  .child-overview {
    margin-top: 16px;
    display: grid;
    gap: 10px;
  }

  .child-overview-label {
    font-size: 12px;
    color: var(--text-soft);
  }

  .child-brief {
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    border-radius: 18px;
    background: #fff;
    box-shadow: var(--shadow-sm);
  }

  .child-brief-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
  }

  .child-brief-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-strong);
  }

  .child-brief-meta {
    margin-top: 3px;
    font-size: 12px;
    color: var(--text-soft);
  }

  .service-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .service-chip {
    padding: 10px 12px;
    border-radius: 999px;
    background: #fff;
    box-shadow: var(--shadow-sm);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-main);
  }

  .search-box {
    width: 100%;
    margin-top: 14px;
    padding: 13px 14px;
    border-radius: 18px;
    background: #f4f6fb;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    color: var(--text-soft);
  }

  .search-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .footer-note {
    margin-top: 16px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-soft);
    text-align: center;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 34px;
    transform: translate(-50%, 18px);
    padding: 11px 16px;
    border-radius: 999px;
    background: rgba(20, 28, 63, 0.92);
    color: #fff;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease, transform 180ms ease;
    z-index: 20;
    white-space: nowrap;
  }

  .toast.visible {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  @media (max-width: 480px) {
    body {
      padding: 0;
    }

    .phone-shell,
    .page {
      width: 100%;
      min-height: 100vh;
      border-radius: 0;
    }
  }
</style>
</head>
<body>
<div class="preview-shell">
  <div class="phone-shell">
    <div class="page" id="app"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  const PAGE_DATA = {
    customer: {
      name: "张小明妈妈",
      nickname: "昵称：利达",
      badge: "跟进成交率高",
      note: "晚上 7 点到 8 点方便沟通，尽量不要在白天联系。",
      addedAt: "2025-09-23 10:09"
    },
    tags: ["未购", "自然进店", "高意向", "T30 Pro", "门店老客转介绍"],
    behaviors: [
      "昨日兑换积分商品，尚未核销，适合邀约到店体验。",
      "2026/04/12 打开学习机活动页，查看伴学服务说明。",
      "2026/04/10 下载《开学收心指南【小学】》，对孩子使用节奏较关注。"
    ],
    children: [
      {
        id: "ming",
        name: "张小明",
        grade: "五年级",
        purchaseDays: 12,
        level: "danger",
        levelLabel: "异常优先",
        summary: "孩子存在明显异常使用行为，建议优先联系家长。",
        highlight: "已连续 3 天未使用，且 4 月 12 日 23:28 仍有学习机使用记录。",
        metrics: [
          { label: "异常提醒", value: "2 条" },
          { label: "关键异常", value: "23:28 仍在使用" },
          { label: "计划完成率", value: "14%" }
        ],
        action: "建议：优先沟通异常使用行为，并发送提醒督促型督学话术。",
        detail: "本周使用 1 天 · 学习应用占比 34% · 连续未使用 3 天",
        periodId: "thisWeek"
      },
      {
        id: "mei",
        name: "张小美",
        grade: "二年级",
        purchaseDays: 9,
        level: "good",
        levelLabel: "表现稳定",
        summary: "孩子近期使用情况稳定，可查看详细督学报告。",
        highlight: "学习应用占比 82%，英语打卡已完成 7/7，当前适合鼓励型跟进。",
        metrics: [
          { label: "本周使用", value: "4 天" },
          { label: "异常提醒", value: "暂无" },
          { label: "计划完成率", value: "86%" }
        ],
        action: "建议：查看报告并发送鼓励型督学话术，继续稳住当前节奏。",
        detail: "本周总时长 5 小时 24 分 · 阅读和英语投入稳定",
        periodId: "thisWeek"
      }
    ]
  };

  const severityRank = { danger: 3, warning: 2, good: 1 };
  const app = document.getElementById("app");
  const toast = document.getElementById("toast");

  function getFocusChild() {
    return PAGE_DATA.children.slice().sort((left, right) => severityRank[right.level] - severityRank[left.level])[0];
  }

  function getStatusClass(level) {
    return level === "danger" ? "danger" : level === "warning" ? "warning" : "good";
  }

  function renderTags() {
    return PAGE_DATA.tags.map((tag) => {
      const type = tag === "高意向" ? "green" : tag === "未购" ? "gray" : "blue";
      return '<span class="tag ' + type + '">' + tag + '</span>';
    }).join("");
  }

  function renderBehaviors() {
    return PAGE_DATA.behaviors.map((behavior) => `
      <div class="behavior-item">
        <span class="behavior-dot"></span>
        <div class="behavior-text">${behavior}</div>
      </div>
    `).join("");
  }

  function renderChildOverview(focusChildId) {
    return PAGE_DATA.children.map((child) => `
      <button class="child-brief" type="button" data-child-id="${child.id}">
        <div class="child-brief-top">
          <div>
            <div class="child-brief-name">${child.name} · ${child.grade}</div>
            <div class="child-brief-meta">${child.detail}</div>
          </div>
          <span class="status-pill ${getStatusClass(child.level)}">${child.levelLabel}</span>
        </div>
      </button>
    `).join("");
  }

  function renderPage() {
    const focusChild = getFocusChild();

    app.innerHTML = `
      <div class="nav-bar">
        <button class="nav-btn" type="button" aria-label="返回">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M10.5 4.5L6 9L10.5 13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <div class="nav-title">
          <div class="nav-title-main">客户详情</div>
          <div class="nav-title-sub">客户详情 → 跟进内容推荐 → 督学看板</div>
        </div>
        <div class="ghost-slot"></div>
      </div>

      <section class="hero-card">
        <div class="hero-top">
          <div>
            <div class="hero-label">Customer Detail</div>
            <div class="hero-title">${PAGE_DATA.customer.name}</div>
            <div class="hero-note">${PAGE_DATA.customer.nickname} · 该客户当前存在明确学情跟进机会，系统已生成优先入口。</div>
          </div>
          <div class="hero-aside">本周建议<br>优先学情跟进</div>
        </div>
        <div class="hero-panels">
          <div class="hero-panel">
            <div class="hero-panel-value">2 个孩子</div>
            <div class="hero-panel-label">当前需同步巡检的购机用户</div>
          </div>
          <div class="hero-panel">
            <div class="hero-panel-value">异常优先</div>
            <div class="hero-panel-label">建议先联系张小明家长</div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <div>
            <div class="section-title">客户信息</div>
            <div class="section-note">导购沟通前的基础识别信息</div>
          </div>
        </div>
        <div class="customer-main">
          <div class="customer-avatar">张</div>
          <div>
            <div class="customer-name-row">
              <div class="customer-name">${PAGE_DATA.customer.name}</div>
              <span class="customer-badge">${PAGE_DATA.customer.badge}</span>
            </div>
            <div class="customer-sub">${PAGE_DATA.customer.nickname}</div>
          </div>
        </div>
        <div class="detail-grid">
          <div class="detail-row">
            <div class="detail-label">联系偏好</div>
            <div class="detail-value">${PAGE_DATA.customer.note}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">加微时间</div>
            <div class="detail-value">${PAGE_DATA.customer.addedAt}</div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <div>
            <div class="section-title">意向跟进标签</div>
            <div class="section-note">标签由系统自动沉淀，无需手动修改</div>
          </div>
        </div>
        <div class="tags">${renderTags()}</div>
      </section>

      <section class="card">
        <div class="section-head">
          <div>
            <div class="section-title">成交意向评估</div>
            <div class="section-note">系统根据用户行为推荐当前最适合的跟进动作</div>
          </div>
          <button class="text-link" type="button">更多行为 ></button>
        </div>
        <div class="behavior-list">${renderBehaviors()}</div>
      </section>

      <section class="card study-entry">
        <div class="section-head" style="padding:16px 16px 0 16px; margin-bottom:0;">
          <div>
            <div class="section-title">跟进内容推荐</div>
            <div class="section-note">优先展示可直接进入督学看板的学情入口</div>
          </div>
          <button class="text-link" type="button">更多话术 ></button>
        </div>
        <div class="entry-card" id="entryCard" data-child-id="${focusChild.id}">
          <div class="entry-top">
            <div>
              <div class="entry-kicker">学情推荐</div>
              <div class="entry-title">查看督学看板</div>
            </div>
            <span class="entry-link">立即进入 ></span>
          </div>
          <div style="margin-top:12px;">
            <span class="status-pill ${getStatusClass(focusChild.level)}">${focusChild.levelLabel}</span>
          </div>
          <div class="entry-summary">${focusChild.summary}</div>
          <div class="focus-box">
            <div class="focus-label">当前建议优先跟进</div>
            <div class="focus-main">
              <div>
                <div class="focus-name">${focusChild.name} · ${focusChild.grade}</div>
                <div class="focus-meta">购机 ${focusChild.purchaseDays} 天 · 默认定位 ${focusChild.name} 的本周报告</div>
              </div>
              <span class="focus-tag">优先查看</span>
            </div>
            <div class="entry-summary" style="margin-top:10px;">${focusChild.highlight}</div>
          </div>
          <div class="metric-grid">
            ${focusChild.metrics.map((metric) => `
              <div class="metric-card">
                <div class="metric-value">${metric.value}</div>
                <div class="metric-label">${metric.label}</div>
              </div>
            `).join("")}
          </div>
          <div class="action-callout ${getStatusClass(focusChild.level)}">${focusChild.action}</div>
          <div class="child-overview">
            <div class="child-overview-label">孩子速览：如需查看其他孩子，可直接切换进入</div>
            ${renderChildOverview(focusChild.id)}
          </div>
          <div class="service-row">
            <button class="service-chip" type="button" data-child-id="${focusChild.id}">进入报告页</button>
            <button class="service-chip" type="button" data-child-id="${focusChild.id}" data-view="script">直接查看话术页</button>
          </div>
        </div>
        <button class="search-box" type="button">
          <svg class="search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.3"></circle>
            <line x1="11" y1="11" x2="14" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></line>
          </svg>
          <span>搜索内容标签，查看更多跟进话术</span>
        </button>
      </section>

      <div class="footer-note">入口页已聚焦“最需跟进的孩子”，进入后会自动定位到对应督学看板。</div>
    `;
  }

  function openDashboard(childId, view) {
    const child = PAGE_DATA.children.find((item) => item.id === childId) || getFocusChild();
    const params = new URLSearchParams({
      child: child.id,
      period: child.periodId || "thisWeek"
    });
    if (view) {
      params.set("view", view);
    }
    window.location.href = "supervisor-dashboard-preview-v2.html?" + params.toString();
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("visible");
    window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(() => {
      toast.classList.remove("visible");
    }, 1500);
  }

  app.addEventListener("click", (event) => {
    const service = event.target.closest(".service-chip");
    if (service) {
      openDashboard(service.getAttribute("data-child-id"), service.getAttribute("data-view") || "");
      return;
    }

    const childBrief = event.target.closest(".child-brief");
    if (childBrief) {
      openDashboard(childBrief.getAttribute("data-child-id"));
      return;
    }

    const entryCard = event.target.closest("#entryCard");
    if (entryCard) {
      openDashboard(entryCard.getAttribute("data-child-id"));
      return;
    }

    const search = event.target.closest(".search-box");
    if (search) {
      showToast("此处为预留话术搜索入口");
    }
  });

  renderPage();
</script>
</body>
</html>
