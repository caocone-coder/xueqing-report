<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>督学看板预览 V2</title>
<style>
  :root {
    --bg-top: #f6efe7;
    --bg-bottom: #eef3ff;
    --phone-bg: #f6f8fe;
    --card-bg: rgba(255, 255, 255, 0.94);
    --card-strong: #ffffff;
    --line: #e8ebf5;
    --line-strong: #d8ddf0;
    --text-strong: #1f2758;
    --text-main: #485071;
    --text-soft: #8188a4;
    --accent: #4f68d8;
    --accent-deep: #384ea7;
    --accent-soft: #edf1ff;
    --accent-mint: #e9f7f0;
    --success: #2fb36e;
    --success-soft: #e8f8ef;
    --warning: #f29c38;
    --warning-soft: #fff3e5;
    --danger: #e55f68;
    --danger-soft: #ffedf0;
    --shadow-lg: 0 30px 80px rgba(44, 62, 136, 0.18);
    --shadow-md: 0 16px 34px rgba(45, 62, 128, 0.1);
    --shadow-sm: 0 6px 16px rgba(65, 86, 172, 0.08);
    --radius-xl: 28px;
    --radius-lg: 20px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --safe-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(255, 255, 255, 0.92) 0, rgba(255, 255, 255, 0) 34%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--text-main);
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 999px;
    pointer-events: none;
    filter: blur(10px);
    opacity: 0.72;
  }

  body::before {
    width: 260px;
    height: 260px;
    background: rgba(255, 227, 192, 0.48);
    top: -120px;
    right: -60px;
  }

  body::after {
    width: 320px;
    height: 320px;
    background: rgba(178, 201, 255, 0.36);
    left: -140px;
    bottom: -120px;
  }

  .preview-shell {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .phone-shell {
    width: min(100%, 414px);
    min-height: calc(100vh - 48px);
    background:
      radial-gradient(circle at top right, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0) 28%),
      linear-gradient(180deg, #f8faff 0%, var(--phone-bg) 100%);
    border-radius: 34px;
    box-shadow: var(--shadow-lg);
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.55);
  }

  .phone-shell::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 85% 8%, rgba(93, 124, 255, 0.14), rgba(93, 124, 255, 0) 22%),
      radial-gradient(circle at 6% 24%, rgba(253, 189, 112, 0.14), rgba(253, 189, 112, 0) 20%);
    pointer-events: none;
  }

  .app-root {
    min-height: calc(100vh - 48px);
    position: relative;
  }

  .view {
    min-height: calc(100vh - 48px);
    position: relative;
  }

  .report-view {
    padding: 20px 16px calc(24px + var(--safe-bottom));
  }

  .script-view {
    padding: 14px 16px calc(28px + var(--safe-bottom));
  }

  .hero-card {
    position: relative;
    overflow: hidden;
    padding: 18px 18px 16px;
    border-radius: 26px;
    background:
      linear-gradient(145deg, rgba(82, 108, 220, 0.98), rgba(61, 81, 175, 0.94)),
      linear-gradient(180deg, #5f7df4 0%, #4157b7 100%);
    color: #fff;
    box-shadow: 0 20px 34px rgba(53, 72, 158, 0.26);
    animation: rise-in 320ms ease;
  }

  .hero-card::before,
  .hero-card::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    pointer-events: none;
  }

  .hero-card::before {
    width: 180px;
    height: 180px;
    top: -92px;
    right: -46px;
  }

  .hero-card::after {
    width: 120px;
    height: 120px;
    bottom: -48px;
    left: -24px;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .hero-title {
    margin-top: 6px;
    font-size: 28px;
    line-height: 1.15;
    font-weight: 700;
  }

  .hero-subtitle {
    margin-top: 6px;
    font-size: 13px;
    line-height: 1.55;
    color: rgba(255, 255, 255, 0.84);
  }

  .hero-time {
    padding: 8px 10px;
    min-width: 78px;
    text-align: center;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    font-size: 12px;
    line-height: 1.35;
    color: rgba(255, 255, 255, 0.88);
  }

  .hero-summary {
    margin-top: 14px;
    padding: 14px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.13);
    backdrop-filter: blur(10px);
  }

  .summary-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    background: rgba(255, 255, 255, 0.18);
  }

  .summary-pill::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.12);
  }

  .summary-pill.danger {
    color: #ffd3d8;
  }

  .summary-pill.warning {
    color: #ffe4bf;
  }

  .summary-pill.good {
    color: #d9ffe8;
  }

  .summary-title {
    margin-top: 10px;
    font-size: 18px;
    line-height: 1.4;
    font-weight: 600;
  }

  .summary-note {
    margin-top: 6px;
    font-size: 13px;
    line-height: 1.55;
    color: rgba(255, 255, 255, 0.82);
  }

  .hero-metrics {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-top: 14px;
  }

  .hero-metric {
    padding: 10px 10px 12px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(6px);
  }

  .hero-metric-value {
    font-size: 18px;
    line-height: 1.1;
    font-weight: 700;
  }

  .hero-metric-label {
    margin-top: 4px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.8);
  }

  .period-switcher {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    padding: 6px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.92);
    box-shadow: var(--shadow-sm);
  }

  .period-button,
  .child-tab,
  .dim-tab,
  .scene-chip,
  .alert-chip,
  .ghost-button,
  .primary-button,
  .back-button,
  .toggle-button,
  .month-stat,
  .calendar-cell,
  .link-button,
  .text-button {
    appearance: none;
    border: none;
    background: transparent;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }

  .period-button {
    flex: 1;
    padding: 11px 10px;
    border-radius: 14px;
    color: var(--text-soft);
    text-align: left;
    transition: background 160ms ease, color 160ms ease, transform 160ms ease;
  }

  .period-button.active {
    background: linear-gradient(180deg, #f8faff 0%, #eef2ff 100%);
    color: var(--accent-deep);
    box-shadow: inset 0 0 0 1px rgba(79, 104, 216, 0.14);
  }

  .period-name {
    display: block;
    font-size: 14px;
    font-weight: 700;
  }

  .period-range {
    display: block;
    margin-top: 3px;
    font-size: 12px;
    color: var(--text-soft);
  }

  .period-button.active .period-range {
    color: rgba(56, 78, 167, 0.74);
  }

  .child-strip {
    margin-top: 16px;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }

  .child-strip::-webkit-scrollbar {
    display: none;
  }

  .child-tab {
    flex: 0 0 auto;
    min-width: 124px;
    padding: 14px 14px 13px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.82);
    box-shadow: var(--shadow-sm);
    border: 1px solid transparent;
    transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
  }

  .child-tab.active {
    background: #fff;
    border-color: rgba(79, 104, 216, 0.16);
    transform: translateY(-1px);
  }

  .child-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-strong);
  }

  .child-meta {
    margin-top: 4px;
    font-size: 12px;
    color: var(--text-soft);
  }

  .child-state {
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }

  .child-state.danger {
    color: var(--danger);
    background: var(--danger-soft);
  }

  .child-state.warning {
    color: var(--warning);
    background: var(--warning-soft);
  }

  .child-state.good {
    color: var(--success);
    background: var(--success-soft);
  }

  .card {
    margin-top: 14px;
    padding: 16px;
    border-radius: 22px;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    border: 1px solid rgba(255, 255, 255, 0.7);
    animation: rise-in 320ms ease;
  }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 14px;
  }

  .card-title {
    font-size: 17px;
    line-height: 1.2;
    font-weight: 700;
    color: var(--text-strong);
  }

  .card-subtitle {
    margin-top: 4px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-soft);
  }

  .head-chip {
    flex-shrink: 0;
    padding: 7px 10px;
    border-radius: 999px;
    background: #f4f6fd;
    color: var(--text-main);
    font-size: 12px;
    font-weight: 600;
  }

  .head-chip.warning {
    background: var(--warning-soft);
    color: var(--warning);
  }

  .head-chip.good {
    background: var(--success-soft);
    color: var(--success);
  }

  .calendar-legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-soft);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .legend-dot.used {
    background: var(--success);
  }

  .legend-dot.unused {
    background: var(--danger);
  }

  .legend-dot.future {
    background: #dfe4f1;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px 4px;
  }

  .weekday {
    font-size: 12px;
    color: var(--text-soft);
    text-align: center;
    padding-bottom: 4px;
  }

  .calendar-cell {
    width: 100%;
    min-height: 44px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    position: relative;
    transition: transform 160ms ease, box-shadow 160ms ease;
  }

  .calendar-cell.empty {
    cursor: default;
    pointer-events: none;
  }

  .calendar-cell.used {
    color: var(--success);
    background: linear-gradient(180deg, #f0fbf5 0%, #e3f7eb 100%);
    box-shadow: inset 0 0 0 1px rgba(47, 179, 110, 0.16);
  }

  .calendar-cell.unused {
    color: var(--danger);
    background: linear-gradient(180deg, #fff4f5 0%, #ffebee 100%);
    box-shadow: inset 0 0 0 1px rgba(229, 95, 104, 0.14);
  }

  .calendar-cell.future {
    color: #aab0c5;
    background: linear-gradient(180deg, #f6f7fc 0%, #eef1f8 100%);
    box-shadow: inset 0 0 0 1px rgba(170, 176, 197, 0.12);
    cursor: default;
  }

  .calendar-cell.today::after {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 12px;
    border: 1px dashed rgba(79, 104, 216, 0.32);
  }

  .calendar-cell.used:hover,
  .calendar-cell.unused:hover,
  .period-button:hover,
  .child-tab:hover,
  .dim-tab:hover,
  .scene-chip:hover,
  .alert-chip:hover,
  .ghost-button:hover,
  .primary-button:hover,
  .toggle-button:hover {
    transform: translateY(-1px);
  }

  .calendar-summary {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .month-stat {
    padding: 12px 10px;
    border-radius: 18px;
    text-align: left;
    background: #f7f9ff;
    box-shadow: inset 0 0 0 1px rgba(79, 104, 216, 0.05);
    cursor: default;
  }

  .month-stat.highlight {
    background: linear-gradient(180deg, #fff7f8 0%, #fff0f3 100%);
    box-shadow: inset 0 0 0 1px rgba(229, 95, 104, 0.12);
  }

  .month-stat-value {
    font-size: 16px;
    line-height: 1.2;
    font-weight: 700;
    color: var(--text-strong);
  }

  .month-stat.highlight .month-stat-value {
    color: var(--danger);
  }

  .month-stat-label {
    margin-top: 4px;
    font-size: 12px;
    line-height: 1.45;
    color: var(--text-soft);
  }

  .metric-ribbon {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }

  .metric-box {
    padding: 12px;
    border-radius: 18px;
    background: #f7f9ff;
  }

  .metric-box-title {
    font-size: 12px;
    color: var(--text-soft);
  }

  .metric-box-value {
    margin-top: 6px;
    font-size: 22px;
    line-height: 1.1;
    font-weight: 700;
    color: var(--text-strong);
  }

  .metric-box-value.up {
    color: var(--success);
  }

  .metric-box-value.down {
    color: var(--warning);
  }

  .warning-banner {
    padding: 11px 12px;
    border-radius: 16px;
    margin-bottom: 14px;
    font-size: 12px;
    line-height: 1.55;
    background: linear-gradient(180deg, #fff8eb 0%, #fff1df 100%);
    color: #b56b15;
    border: 1px solid rgba(242, 156, 56, 0.12);
  }

  .app-group + .app-group {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  .group-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .group-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-strong);
  }

  .group-meta {
    font-size: 12px;
    color: var(--text-soft);
  }

  .app-row + .app-row {
    margin-top: 12px;
  }

  .app-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .app-icon {
    width: 40px;
    height: 40px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    box-shadow: inset 0 -8px 20px rgba(0, 0, 0, 0.12);
  }

  .app-icon.indigo {
    background: linear-gradient(180deg, #6785ff 0%, #5268d8 100%);
  }

  .app-icon.blue {
    background: linear-gradient(180deg, #5fb5ff 0%, #3d84df 100%);
  }

  .app-icon.mint {
    background: linear-gradient(180deg, #5dc4b2 0%, #2ea289 100%);
  }

  .app-icon.orange {
    background: linear-gradient(180deg, #ffb363 0%, #f08b2f 100%);
  }

  .app-icon.rose {
    background: linear-gradient(180deg, #ff8f9a 0%, #e56576 100%);
  }

  .app-main {
    min-width: 0;
    flex: 1;
  }

  .app-name-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: baseline;
  }

  .app-name-text {
    min-width: 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-strong);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .app-time {
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-main);
  }

  .app-desc {
    margin-top: 2px;
    font-size: 12px;
    color: var(--text-soft);
  }

  .bar-track {
    margin-top: 8px;
    height: 7px;
    border-radius: 999px;
    background: #edf0f8;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: inherit;
  }

  .bar-fill.learn {
    background: linear-gradient(90deg, #6480ff 0%, #536ddf 100%);
  }

  .bar-fill.other {
    background: linear-gradient(90deg, #ffb25f 0%, #f18f34 100%);
  }

  .toggle-button {
    margin-top: 12px;
    padding: 0;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
  }

  .plan-list {
    display: grid;
    gap: 12px;
  }

  .plan-item {
    padding: 14px;
    border-radius: 18px;
    background: #fbfcff;
    box-shadow: inset 0 0 0 1px rgba(79, 104, 216, 0.06);
  }

  .plan-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
  }

  .plan-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-strong);
  }

  .plan-sub {
    margin-top: 3px;
    font-size: 12px;
    color: var(--text-soft);
  }

  .status-chip {
    flex-shrink: 0;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }

  .status-chip.done {
    color: var(--success);
    background: var(--success-soft);
  }

  .status-chip.ongoing {
    color: var(--accent);
    background: var(--accent-soft);
  }

  .status-chip.behind {
    color: var(--warning);
    background: var(--warning-soft);
  }

  .plan-progress {
    margin-top: 12px;
    height: 10px;
    border-radius: 999px;
    background: #ecf0f9;
    overflow: hidden;
  }

  .plan-progress-fill {
    height: 100%;
    border-radius: inherit;
  }

  .plan-progress-fill.done {
    background: linear-gradient(90deg, #43c983 0%, #29b06c 100%);
  }

  .plan-progress-fill.ongoing {
    background: linear-gradient(90deg, #6687ff 0%, #4d67db 100%);
  }

  .plan-progress-fill.behind {
    background: linear-gradient(90deg, #ffb765 0%, #f29c38 100%);
  }

  .plan-bottom {
    margin-top: 8px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: var(--text-soft);
  }

  .plan-overall {
    margin-top: 14px;
    padding: 14px;
    border-radius: 18px;
    background: linear-gradient(180deg, #f5f7ff 0%, #eef2ff 100%);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
  }

  .overall-label {
    font-size: 13px;
    color: var(--text-main);
  }

  .overall-value {
    font-size: 22px;
    line-height: 1.1;
    font-weight: 700;
    color: var(--text-strong);
  }

  .empty-card {
    padding: 18px 14px;
    border-radius: 18px;
    background: #fafbff;
    border: 1px dashed var(--line-strong);
    text-align: center;
    color: var(--text-soft);
  }

  .empty-emoji {
    font-size: 24px;
    line-height: 1;
  }

  .empty-title {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-main);
  }

  .empty-desc {
    margin-top: 6px;
    font-size: 12px;
    line-height: 1.6;
  }

  .bottom-action {
    position: sticky;
    bottom: 10px;
    display: flex;
    gap: 10px;
    margin-top: 18px;
    padding: 10px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.86);
    box-shadow: 0 10px 24px rgba(52, 70, 142, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(16px);
  }

  .ghost-button,
  .primary-button {
    flex: 1;
    padding: 14px 14px;

  const state = {
    currentView: "report",
    currentPeriodId: APP_DATA.periods[0].id,
    currentChildId: APP_DATA.children[0].id,
    currentDimension: "basic",
    currentScene: "remind",
    currentAlertIndex: 0,
    expandedGroups: {},
    variantIndexMap: {},
    activeDay: null
  };

  const root = document.getElementById("app");
  const toast = document.getElementById("toast");
  const sheetMask = document.getElementById("sheetMask");
  const daySheet = document.getElementById("daySheet");

  function getCurrentChild() {
    return APP_DATA.children.find((child) => child.id === state.currentChildId) || APP_DATA.children[0];
  }

  function getCurrentPeriod() {
    return APP_DATA.periods.find((period) => period.id === state.currentPeriodId) || APP_DATA.periods[0];
  }

  function getCurrentPeriodData() {
    return getCurrentChild().periods[state.currentPeriodId];
  }

  function resetScriptStateForChild() {
    const child = getCurrentChild();
    state.currentDimension = child.scriptDefaults.dimension;
    state.currentScene = child.scriptDefaults.scene;
    state.currentAlertIndex = 0;
  }

  function applyQueryState() {
    const params = new URLSearchParams(window.location.search);
    const childId = params.get("child");
    const periodId = params.get("period");
    const view = params.get("view");

    if (childId && APP_DATA.children.some((child) => child.id === childId)) {
      state.currentChildId = childId;
    }

    if (periodId && APP_DATA.periods.some((period) => period.id === periodId)) {
      state.currentPeriodId = periodId;
    }

    resetScriptStateForChild();

    if (view === "script") {
      state.currentView = "script";
    }
  }

  function formatMinutes(minutes) {
    const safe = Math.max(0, minutes || 0);
    const hour = Math.floor(safe / 60);
    const minute = safe % 60;
    if (hour && minute) {
      return hour + " 小时 " + minute + " 分";
    }
    if (hour) {
      return hour + " 小时";
    }
    return minute + " 分钟";
  }

  function formatPct(pct) {
    return (pct > 0 ? "+" : "") + pct + "%";
  }

  function getChildStateClass(level) {
    if (level === "danger") return "danger";
    if (level === "warning") return "warning";
    return "good";
  }

  function getUsedCount(calendar) {
    return Object.keys(calendar.usedDays).filter((day) => calendar.usedDays[day] && calendar.usedDays[day].totalMinutes > 0).length;
  }

  function getDaysInMonth(calendar) {
    return new Date(calendar.year, calendar.month, 0).getDate();
  }

  function buildVariantKey() {
    const base = [state.currentChildId, state.currentPeriodId, state.currentDimension];
    if (state.currentDimension === "basic") {
      base.push(state.currentScene);
    }
    if (state.currentDimension === "alert") {
      base.push(String(state.currentAlertIndex));
    }
    return base.join(":");
  }

  function getActiveScriptModel() {
    const scripts = getCurrentPeriodData().scripts;

    if (state.currentDimension === "basic") {
      const scene = scripts.basic.scenes[state.currentScene];
      const variants = scene.variants;
      const key = buildVariantKey();
      const index = state.variantIndexMap[key] || 0;
      const active = variants[index % variants.length];
      return {
        empty: false,
        badge: scene.label,
        title: "AI 已生成可转发话术",
        note: "口语化、温和表达，可直接复制到企微发送。",
        text: active.text,
        summary: active.summary
      };
    }

    if (state.currentDimension === "usage") {
      const variants = scripts.usage.variants;
      const key = buildVariantKey();
      const index = state.variantIndexMap[key] || 0;
      const active = variants[index % variants.length];
      return {
        empty: false,
        badge: "使用情况跟踪",
        title: "聚焦孩子近期学习投入与变化",
        note: "突出投入亮点，也保留温和提醒。",
        text: active.text,
        summary: active.summary
      };
    }

    if (!scripts.alerts.length) {
      return {
        empty: true,
        badge: "异常提醒",
        title: "暂无异常",
        note: "当前没有可提示家长的风险行为。",
        text: "",
        summary: []
      };
    }

    const alertItem = scripts.alerts[state.currentAlertIndex] || scripts.alerts[0];
    const variants = alertItem.variants;
    const key = buildVariantKey();
    const index = state.variantIndexMap[key] || 0;
    const active = variants[index % variants.length];
    return {
      empty: false,
      badge: alertItem.type,
      title: "聚焦当前最需要关注的异常行为",
      note: "语气保持温和明确，不指责孩子。",
      text: active.text,
      summary: active.summary
    };
  }

    root.innerHTML = state.currentView === "report" ? renderReportView() : renderScriptView();

  function renderCalendarCard(calendar) {
    const firstWeekday = new Date(calendar.year, calendar.month - 1, 1).getDay();
    const daysInMonth = getDaysInMonth(calendar);
    const usedCount = getUsedCount(calendar);
    const passedDays = calendar.today;
    const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
    const cells = [];

    for (let index = 0; index < firstWeekday; index += 1) {
      cells.push('<div class="calendar-cell empty"></div>');
    }

    for (let day = 1; day <= daysInMonth; day += 1) {
      const detail = calendar.usedDays[String(day)];
      let status = "future";
      if (day <= calendar.today) {
        status = detail && detail.totalMinutes > 0 ? "used" : "unused";
      }
      const button = status === "future"
        ? `<div class="calendar-cell ${status} ${day === calendar.today ? "today" : ""}">${day}</div>`
        : `<button class="calendar-cell ${status} ${day === calendar.today ? "today" : ""}" type="button" data-action="open-day" data-day="${day}">${day}</button>`;
      cells.push(button);
    }

    return `
      <section class="card">
        <div class="card-head">
          <div>
            <div class="card-title">日历打卡视图</div>
            <div class="card-subtitle">${calendar.year} 年 ${calendar.month} 月 · 点击日期查看当天使用明细</div>
          </div>
          <div class="head-chip">月视图</div>
        </div>
        <div class="calendar-legend">
          <span class="legend-item"><span class="legend-dot used"></span>已使用</span>
          <span class="legend-item"><span class="legend-dot unused"></span>未使用</span>
          <span class="legend-item"><span class="legend-dot future"></span>未到</span>
        </div>
        <div class="calendar-grid">
          ${weekdays.map((day) => `<div class="weekday">${day}</div>`).join("")}
          ${cells.join("")}
        </div>
        <div class="calendar-summary">
          <div class="month-stat">
            <div class="month-stat-value">${usedCount}/${passedDays} 天</div>
            <div class="month-stat-label">本月已使用天数 / 已过天数</div>
          </div>
          <div class="month-stat">
            <div class="month-stat-value">${calendar.weekUsedDays} 天</div>
            <div class="month-stat-label">本周已使用天数</div>
          </div>
          <div class="month-stat ${calendar.inactiveStreak >= 3 ? "highlight" : ""}">
            <div class="month-stat-value">${calendar.inactiveStreak} 天</div>
            <div class="month-stat-label">连续未使用天数</div>
          </div>
        </div>
      </section>
    `;
  }

  function renderAppGroup(group, items) {
    const expandKey = state.currentChildId + ":" + state.currentPeriodId + ":" + group.key;

  function openDay(day) {
    const calendar = getCurrentPeriodData().calendar;
    const detail = calendar.usedDays[String(day)];
    const dateTitle = calendar.month + " 月 " + day + " 日";
    const used = detail && detail.totalMinutes > 0;

    if (day > calendar.today) {
      return;

    daySheet.innerHTML = used ? `
      <div class="sheet-handle"></div>
      <div class="sheet-title">${dateTitle}</div>
      <div class="sheet-subtitle">学习机当日使用详情</div>
      <div class="sheet-summary">
        <div class="sheet-summary-value">${formatMinutes(detail.totalMinutes)}</div>
        <div class="sheet-summary-label">当日学习类应用总时长</div>
      </div>
      <div class="sheet-list">
        ${detail.apps.map((app) => `
          <div class="sheet-item">
            <div class="sheet-item-name">${app.name}</div>
            <div class="sheet-item-time">${formatMinutes(app.minutes)}</div>
          </div>
        `).join("")}
      </div>
      <div class="sheet-foot">${detail.note}</div>
    ` : `
      <div class="sheet-handle"></div>
      <div class="sheet-title">${dateTitle}</div>
      <div class="sheet-subtitle">当天暂无学习机使用记录</div>
      <div class="empty-card" style="margin-top: 16px;">
        <div class="empty-emoji">-</div>
        <div class="empty-title">当日未使用</div>
        <div class="empty-desc">当天未达到学习类应用累计使用 5 分钟的判定标准，因此记为未使用。</div>
      </div>
    `;

    sheetMask.classList.add("visible");
    daySheet.classList.add("visible");
    state.activeDay = day;
  }

  function closeDay() {
    sheetMask.classList.remove("visible");
    daySheet.classList.remove("visible");
    state.activeDay = null;
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("visible");
    window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(() => {
      toast.classList.remove("visible");
    }, 1600);
  }

  async function copyText(text) {
    if (!text) {
      showToast("当前没有可复制的话术");
      return;
    }

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        showToast("已复制到剪贴板");
        return;
      }
    } catch (error) {
      // Fallback below.
    }

    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.setAttribute("readonly", "readonly");
    textarea.style.position = "fixed";
    textarea.style.top = "-1000px";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    textarea.setSelectionRange(0, text.length);

    let copied = false;
    try {
      copied = document.execCommand("copy");
    } catch (error) {
      copied = false;
    }

    document.body.removeChild(textarea);
    showToast(copied ? "已复制到剪贴板" : "复制失败，请手动长按选择");
  }

  function refreshScriptVariant() {
    const model = getActiveScriptModel();
    if (model.empty) {
      showToast("当前维度暂无可切换内容");
      return;
    }

    const key = buildVariantKey();
    state.variantIndexMap[key] = (state.variantIndexMap[key] || 0) + 1;
    render();
    showToast("已切换一条新表述");
  }

  function copyCurrentScript() {
    const model = getActiveScriptModel();
    copyText(model.text);
  }

  root.addEventListener("click", (event) => {
    const target = event.target.closest("[data-action]");
    if (!target) {
      return;
    }

    const action = target.getAttribute("data-action");

    if (action === "period") {
      state.currentPeriodId = target.getAttribute("data-period-id");
      closeDay();
      render();
      return;
    }

    if (action === "child") {
      state.currentChildId = target.getAttribute("data-child-id");
      resetScriptStateForChild();
      closeDay();
      render();
      return;
    }

    if (action === "view") {
      state.currentView = target.getAttribute("data-view");
      render();
      return;
    }

    if (action === "open-day") {
      openDay(Number(target.getAttribute("data-day")));
      return;
    }

    if (action === "toggle-group") {
      const key = state.currentChildId + ":" + state.currentPeriodId + ":" + target.getAttribute("data-group-key");
      state.expandedGroups[key] = !state.expandedGroups[key];
      render();
      return;
    }

    if (action === "dimension") {
      state.currentDimension = target.getAttribute("data-dimension");
      state.currentAlertIndex = 0;
      render();
      return;
    }

    if (action === "scene") {
      state.currentScene = target.getAttribute("data-scene");
      render();
      return;
    }

    if (action === "alert") {
      state.currentAlertIndex = Number(target.getAttribute("data-alert-index"));
      render();
      return;
    }

    if (action === "refresh-script") {
      refreshScriptVariant();
      return;
    }

    if (action === "copy-script") {
      copyCurrentScript();
    }
  });

  sheetMask.addEventListener("click", closeDay);
  window.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      closeDay();
    }
  });

  applyQueryState();
  render();
</script>
</body>
</html>
